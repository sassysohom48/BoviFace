services:
  - type: web
    name: boviface-backend
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PIP_VERSION
        value: 25.2
    healthCheckPath: /health
    autoDeploy: true
